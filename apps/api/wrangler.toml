name = "polla-mundial"
main = "src/index.ts"
compatibility_date = "2024-03-20"

# Cron a la :01 y :31 de cada hora, saltando las horas 07-14 UTC completas:
# última corrida 1:31 AM y primera 10:01 AM hora Colombia (franja sin partidos,
# cero llamadas a la API del proveedor).
[triggers]
crons = ["1,31 0-6,15-23 * * *"]

# D1 Database Binding
[[d1_databases]]
binding = "DB"
database_name = "polla-db"
database_id = "3336cd9a-ed98-475d-b55c-fbbe1d58a64e"
migrations_dir = "migrations"

# Non-secret config (safe to commit)
[vars]
FRONTEND_URL = "https://polla-mundial-bf4.pages.dev"
# Proveedor de datos: "apisports" (api-sports.io) o "footballdata" (football-data.org)
FOOTBALL_PROVIDER = "footballdata"
WORLD_CUP_LEAGUE_ID = "1"
WORLD_CUP_SEASON = "2026"

# SECRETS are NOT defined here (this file is committed to git).
#   - Local dev:   put them in apps/api/.dev.vars  (gitignored)
#   - Production:  wrangler secret put <NAME>  (o dashboard > Settings > Variables and Secrets)
# Required secrets:
#   FOOTBALL_API_KEY       (api-sports.io  — si FOOTBALL_PROVIDER=apisports)
#   FOOTBALL_DATA_API_KEY  (football-data.org — si FOOTBALL_PROVIDER=footballdata)
#   JWT_SECRET
